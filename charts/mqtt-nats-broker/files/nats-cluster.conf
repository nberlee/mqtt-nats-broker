# Clustered embedded JetStream for mqtt-nats-broker: an example for three broker pods.
#
# Every node runs this same file, with its routes from MQTTNB_EMBEDDED_ROUTES: on Kubernetes, a
# StatefulSet with podManagementPolicy: Parallel behind a headless Service with
# publishNotReadyAddresses: true, so the route names resolve before any pod is ready.
# A route to the node itself is tolerated. Run the broker with -stream-replicas 3.
#
# MQTTNB_EMBEDDED_SERVER_NAME must be unique per node and stable across restarts (the
# pod name); the four credential variables are as in nats.conf.
#
# Routes are authenticated: a peer that cannot present MQTTNB_EMBEDDED_ROUTE_USER /
# MQTTNB_EMBEDDED_ROUTE_PASS is refused, so reaching port 6222 is not joining the
# cluster (an unauthenticated route listener would let anyone who reaches it read and
# inject account traffic past every client ACL). The outbound side presents the same
# credentials in each route URL, so MQTTNB_EMBEDDED_ROUTES is the whole route list in
# NATS syntax, for example:
#   [nats-route://route:<pass>@broker-0:6222, nats-route://route:<pass>@broker-1:6222,
#    nats-route://route:<pass>@broker-2:6222]
# The broker refuses a cluster listener without route authentication. On an untrusted
# network add a cluster tls {} block with verify; a NetworkPolicy limiting 6222 to the
# broker pods belongs beside it either way.

server_name: $MQTTNB_EMBEDDED_SERVER_NAME
listen: 127.0.0.1:4222

cluster {
  name: mqtt
  listen: 0.0.0.0:6222
  authorization {
    user: $MQTTNB_EMBEDDED_ROUTE_USER
    password: $MQTTNB_EMBEDDED_ROUTE_PASS
  }
  routes: $MQTTNB_EMBEDDED_ROUTES
}

jetstream {
  store_dir: /data
  limits { default_max_consumers: -1 }
}

accounts {
  MQTT {
    jetstream: enabled
    users: [
      { user: $MQTTNB_NATS_USER, password: $MQTTNB_NATS_PASS }
      {
        user: $MQTTNB_DEFAULT_USER
        password: $MQTTNB_DEFAULT_PASS
        permissions: {
          publish: { deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"] }
          subscribe: { deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"] }
        }
      }
    ]
  }
}
