# Local conformance environment: a NATS/JetStream cluster + the MQTT broker.
# Bring up with:  docker compose -f test/conformance/docker-compose.yml up --build
name: mqtt-nats-conformance

services:
  nats:
    # Digest-pinned at the documented 2.15.2 floor, from the upstream publisher's
    # synadia/nats-server repository (Docker Hub, not the Docker Official `nats`
    # image). Keep it a digest, not a floating
    # tag: `latest` would move the backing server with no repository change and no
    # paired default_max_consumers edit. See docs/CONFORMANCE.md.
    image: synadia/nats-server:2.15.2-scratch@sha256:4156d44c6d5f08767a8eaee26255280245ca0063ec64dfbdfcb1e58db7e45c99
    command: ["-c", "/etc/nats/nats.conf", "-sd", "/data"]
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      # Monitoring endpoint: test/conformance/run.sh reads /varz from the host to
      # assert the server version and the effective consumer limit.
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5

  broker:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      # Service connection (JetStream assets) uses the full-rights "service" user.
      # Keep the URL credential-less: DialClient reuses MQTTNB_NATS_URLS for every
      # per-client auth-passthrough dial, and a URL-embedded userinfo would win
      # over the per-client UserInfo (nats.go connectProto), so all clients would
      # inherit the service rights. Service creds go via MQTTNB_NATS_USER/PASS.
      MQTTNB_NATS_URLS: "nats://nats:4222"
      MQTTNB_NATS_USER: "service"
      MQTTNB_NATS_PASS: "service"
      MQTTNB_HOST: "0.0.0.0"
      MQTTNB_PORT: "1883"
      MQTTNB_LOG_LEVEL: "info"
      # Auth passthrough so NATS enforces per-client permissions. Anonymous MQTT
      # clients (the Paho suite connects without credentials) dial as the "mqtt"
      # user, which is denied subscribe on test/nosubscribe (test_subscribe_failure).
      # NOTE: this suite exercises SUBSCRIBE denial only. Its sole publish deny is
      # "$MQTT.>", which mqttProcessPub rejects before any store, so a green run is
      # not evidence that publish authorization works -- it does not (F-079).
      MQTTNB_AUTH_PASSTHROUGH: "true"
      MQTTNB_DEFAULT_USER: "mqtt"
      MQTTNB_DEFAULT_PASS: "mqtt"
      # Server Keep Alive cap the Paho test_server_keep_alive expects (== 60).
      MQTTNB_KEEPALIVE_MAX: "60"
    ports:
      - "1883:1883"
      - "8080:8080"

volumes:
  nats-data:
