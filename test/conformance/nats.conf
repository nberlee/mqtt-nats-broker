# NATS/JetStream config for the conformance environment.
#
# Two users in one JetStream-enabled account (session/retained/QoS streams are
# account-scoped, so all MQTT users must share the account):
#   - "service": the bridge's JetStream-asset service connection. Full rights.
#   - "mqtt":    the auth-passthrough identity for anonymous MQTT clients. Full
#                rights EXCEPT (a) subscribe on "test.nosubscribe" (MQTT topic
#                "test/nosubscribe"), so the broker returns SUBACK 0x80 there
#                (Paho test_subscribe_failure expects it; the reference Paho
#                broker hardcodes the same deny — see docs/CONFORMANCE.md), and
#                (b) BOTH publish and subscribe on "$MQTT.>", the broker's
#                internal namespace, and on "$JS.>", "$KV.>" and "$O.>", the
#                JetStream API and the KV and object-store data subjects.
#
# These denies are the template for real deployments; keep them. An MQTT topic
# maps onto a NATS subject, so without the "$JS.>" deny an anonymous MQTT client
# publishing to $JS/API/STREAM/DELETE/$MQTT_sess deletes the broker's session
# stream (cmd/mqtt-nats-broker/deployment_acl_test.go). "$JS.>" covers the
# domain-qualified API and acknowledgement subjects too. Publishing
# $SYS.REQ.USER.INFO must stay allowed: auth passthrough needs it. Publish deny
# stops a client forging session-persist / JSA traffic; subscribe deny stops it
# reading other clients' messages straight off the internal streams. The broker
# enforces both itself (mqttProcessPub / processSubs), so this is defense in
# depth — but only the ACL binds someone who takes these same credentials and
# connects to NATS directly, bypassing MQTT.
#
# Denying subscribe on the whole prefix is safe because the broker creates its
# own delivery subscriptions ($MQTT.sub.*, $MQTT.deliver.pubrel.*, $MQTT.qsub.*)
# on the service connection, not on the client's. If they were on the client
# connection this deny would break QoS 2 and retained replay, and NATS evaluates
# deny before allow so they could not be carved back out. The conformance suite
# passing with this config is what proves that separation holds.

# `default_max_consumers: -1` is the documented deployment prerequisite, and it is
# unconditional at the 2.15.1 floor. From the 2.15.0 line a peer caps each stream at
# 1000 consumers, and LEAVING THE KEY OUT arms that cap rather than opting out of it:
# the server substitutes JSDefaultMaxConsumersPerStream for a zero value, so the
# absent, the explicit-0 and the 1000 cases are indistinguishable. Only -1 is
# unlimited (F-095).
#
# This file covers the Paho CI job and the Compose environment only. The Rust
# conformance job launches with no config file, so it has its own `nats-plain.conf`;
# the key here does nothing for it.
jetstream {
  enabled: true
  limits { default_max_consumers: -1 }
}

# Monitoring endpoint, required: test/conformance/run.sh reads /varz to assert the
# server version and the effective consumer limit before any suite runs.
http: 8222

accounts {
  APP: {
    jetstream: enabled
    users: [
      {
        user: service
        password: service
        permissions: { publish: ">", subscribe: ">" }
      }
      {
        user: mqtt
        password: mqtt
        permissions: {
          publish: { allow: [">"], deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"] }
          subscribe: { allow: [">"], deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>", "test.nosubscribe"] }
        }
      }
    ]
  }
}
