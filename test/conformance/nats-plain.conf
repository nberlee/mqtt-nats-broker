# NATS/JetStream config for the vibesrc/mqttconformance CI job.
#
# That job runs the broker WITHOUT auth passthrough, so unlike `nats.conf` this
# environment is unauthenticated: no accounts, no users, no ACLs. It exists only
# because the job cannot express the consumer-limit prerequisite on the command
# line — `-js` alone leaves it unset, and unset is not the same as unlimited.
#
# From the nats-server 2.15.0 line a peer caps each stream at 1000 consumers, and
# the server substitutes that default for a zero value, so omitting the key ARMS
# the cap rather than opting out of it. Only -1 is unlimited (F-095). Measured on
# the 2.15.0 GA binary: `-js` with no config reports
# `default_max_consumers: 1000` at /varz, and this file reports -1.
#
# Keep this file minimal and unauthenticated. The ACL separation that the Paho
# environment proves is `nats.conf`'s job, not this one's.
jetstream {
  enabled: true
  limits { default_max_consumers: -1 }
}

# Monitoring endpoint, required: test/conformance/run.sh reads /varz to assert the
# server version and the effective consumer limit before any suite runs.
http: 8222
