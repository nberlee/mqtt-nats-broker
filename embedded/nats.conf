# Embedded JetStream for mqtt-nats-broker: one node, one account, two users.
#
# The credentials are the broker's own variables, and an unset one stops startup:
#   MQTTNB_NATS_USER / MQTTNB_NATS_PASS        the broker's service connection
#   MQTTNB_DEFAULT_USER / MQTTNB_DEFAULT_PASS  what MQTT clients without credentials
#                                              connect as
# Keep the service credentials private: an MQTT client presenting them acts with the
# service user's rights. Mount your own file and point MQTTNB_NATS_EMBEDDED_CONFIG at it
# for anything else (more users, TLS, a cluster: see nats-cluster.conf).

# The broker reaches this server in-process; the client port is for tools inside the
# pod only.
listen: 127.0.0.1:4222

jetstream {
  store_dir: /data
  limits { default_max_consumers: -1 }
}

accounts {
  MQTT {
    jetstream: enabled
    users: [
      { user: $MQTTNB_NATS_USER, password: $MQTTNB_NATS_PASS }
      {
        user: $MQTTNB_DEFAULT_USER
        password: $MQTTNB_DEFAULT_PASS
        # The broker's reserved namespace, the JetStream API ($JS.>, domain-qualified
        # and acknowledgement subjects included) and the KV and object-store data
        # subjects are the service user's alone. An MQTT topic maps onto a NATS
        # subject ($JS/API/STREAM/DELETE/x is $JS.API.STREAM.DELETE.x), so without
        # these denies an anonymous MQTT client could delete the broker's streams.
        # Publishing $SYS.REQ.USER.INFO stays allowed: auth passthrough needs it.
        permissions: {
          publish: { deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"] }
          subscribe: { deny: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"] }
        }
      }
    ]
  }
}
