name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build (default tree)
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...

  fulltests:
    name: test (upstream suite)
    runs-on: ubuntu-latest
    # Ported upstream nats-server MQTT regression suite, run against the
    # standalone broker via an embedded nats-server test harness
    # (fulltests_harness_test.go). Split from build-test since it's a large,
    # separate suite; see docs/PORTING.md ("Testing strategy").
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet -tags mqttport_fulltests ./...
      - name: test
        run: go test -tags mqttport_fulltests -race -count=1 ./internal/mqtt/

  experimental-shared-qos2:
    name: test (experimental shared QoS 2; non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: test
        run: go test -tags 'mqttport_fulltests mqttport_experimental_shared_qos2' -race -count=1 ./internal/mqtt/

  cluster-failover:
    name: test (cluster Will failover)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated 3-node embedded-JetStream (R3) Will-outbox failover tests
    # (jetstream_cluster_harness_test.go). Split into its own job because it
    # spins up three nats-server processes per test and drives Raft leader
    # elections, so it is slower and flakier than the single-node fulltests job.
    # The tests self-skip unless MQTTNB_CLUSTER_FAILOVER_TESTS=1, so the normal
    # fulltests job runs only the cheap R3 smoke test.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: test
        env:
          MQTTNB_CLUSTER_FAILOVER_TESTS: '1'
        run: go test -tags mqttport_fulltests -race -run '^TestMQTTWillOutboxReplicated' ./internal/mqtt/

  depproof:
    name: dependency canary (JetStream terminal-write routes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # F-030's dependency canary: the two routes by which a Will-outbox write
    # conditioned on a superseded base could still reach the stream across a
    # stream-leader transition, run against isolated nats-server checkouts, plus the
    # mutation for each mechanism that closes one. See test/depproof/README.md.
    #
    # The job always starts and decides for itself, from the FILES the change touches,
    # whether the canary can have been invalidated. Gating on the actor or on a label
    # would have missed a hand-written dependency bump, and then the push to main after
    # it -- which is exactly the change that must not land without the canary.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: decide whether this change can invalidate the canary
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An unknown or unborn base means we cannot prove the change is irrelevant,
          # so we run it. Failing open here would be the whole point of the job lost.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- go.mod go.sum test/depproof \
              internal/mqtt/will_terminal_cluster_test.go \
              | grep -q .; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.26'
          cache: true
      - name: route regressions and mutations
        if: steps.gate.outputs.run == 'true'
        run: make depproof

  lint:
    name: lint (go, markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # Pinned, not `latest`: the action resolves the binary, and .golangci.yml is
      # schema v2, which only a golangci-lint 2.x binary accepts. Action v6 mapped
      # `latest` to v1.64.8, so this job rejected the config instead of linting.
      # Bump the action major and this version together.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # Same linter and configuration as `make lint-md`, so a docs change that
      # passes locally cannot fail here (or the reverse).
      - name: markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md'

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build multi-arch (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}

  conformance:
    name: MQTT conformance (vibesrc/mqttconformance)
    runs-on: ubuntu-latest
    # Baseline is 0 failures (124/124 v3.1.1, 106/106 v5); run.sh gates on
    # regressions vs test/conformance/baseline/conformance-v{3,5}.txt.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        # run.sh's floor check decodes /varz with python3 rather than pattern-matching
        # it. This job runs no Python suite, but it does run that check.
        with: { python-version: '3.x' }
      - name: start NATS with JetStream
        # Pinned by digest at the 2.15.1 floor, NOT `latest`: a floating tag would
        # move the backing server with no repository change and no paired config
        # edit. The image is the upstream publisher's synadia/nats-server on Docker
        # Hub (built by nats-io/nats-docker), not the Docker Official `nats` image,
        # which had no 2.15.1 tag when the floor moved. This job used to launch `-js` with no config file; it now needs one,
        # because `-js` alone leaves default_max_consumers at its 1000-per-stream
        # default and that ARMS the cap rather than opting out of it (F-095).
        # nats-plain.conf is this job's own, unauthenticated, and is NOT nats.conf:
        # the Paho job's ACLs would break this job's non-passthrough broker.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/test/conformance/nats-plain.conf:/etc/nats/nats.conf:ro" \
            synadia/nats-server:2.15.1-scratch@sha256:57e8640c67acb4f40fd453cde5518baa601759ed242a476b705bbfb573cf01f2 -c /etc/nats/nats.conf
      - name: build broker
        run: go build -o mqtt-nats-bridge ./cmd/mqtt-nats-bridge
      - name: build mqtt-conformance
        run: |
          git clone --depth 1 https://github.com/vibesrc/mqttconformance /tmp/mc
          (cd /tmp/mc && cargo build --release)
          echo "/tmp/mc/target/release" >> "$GITHUB_PATH"
      - name: run broker
        run: |
          ./mqtt-nats-bridge -nats nats://127.0.0.1:4222 -port 1883 -auth-passthrough=false -log-level warn &
          echo $! > broker.pid
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null && break; sleep 1; done
      - name: run conformance suites
        run: ./test/conformance/run.sh
      - name: stop broker
        if: always()
        run: kill "$(cat broker.pid)" 2>/dev/null || true

  paho:
    name: MQTT conformance (Eclipse Paho interop)
    runs-on: ubuntu-latest
    # Runs the Paho MQTT 5.0 interoperability suite against an auth-passthrough
    # broker backed by a NATS server whose "mqtt" user is denied subscribe on
    # test/nosubscribe (test_subscribe_failure). run.sh gates on regressions vs
    # test/conformance/baseline/paho.txt.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - name: start NATS with JetStream + deny ACL
        # Digest-pinned at the 2.15.1 floor, same image, for the same reason as the job above;
        # see docs/CONFORMANCE.md. Port 8222 is the monitoring endpoint run.sh
        # reads to assert the version and the effective consumer limit.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/test/conformance/nats.conf:/etc/nats/nats.conf:ro" \
            synadia/nats-server:2.15.1-scratch@sha256:57e8640c67acb4f40fd453cde5518baa601759ed242a476b705bbfb573cf01f2 -c /etc/nats/nats.conf
      - name: build broker
        run: go build -o mqtt-nats-bridge ./cmd/mqtt-nats-bridge
      - name: run broker (auth passthrough + deny)
        run: |
          ./mqtt-nats-bridge -nats nats://127.0.0.1:4222 \
            -nats-user service -nats-pass service \
            -port 1883 -auth-passthrough -default-user mqtt -default-pass mqtt \
            -keepalive-max 60 -log-level warn &
          echo $! > broker.pid
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null && break; sleep 1; done
      - name: run Paho interoperability suite
        run: SUITES=paho ./test/conformance/run.sh
      - name: stop broker
        if: always()
        run: kill "$(cat broker.pid)" 2>/dev/null || true
