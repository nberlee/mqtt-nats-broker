name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build (default tree)
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...

  fulltests:
    name: test (upstream suite)
    runs-on: ubuntu-latest
    # Ported upstream nats-server MQTT regression suite, run against the
    # standalone broker via an embedded nats-server test harness
    # (fulltests_harness_test.go). Split from build-test since it's a large,
    # separate suite; see docs/PORTING.md ("Testing strategy").
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet -tags mqttport_fulltests ./...
      - name: test
        run: go test -tags mqttport_fulltests -race -count=1 ./internal/mqtt/

  experimental-shared-qos2:
    name: test (experimental shared QoS 2; non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: test
        run: go test -tags 'mqttport_fulltests mqttport_experimental_shared_qos2' -race -count=1 ./internal/mqtt/

  cluster-failover:
    name: test (cluster Will failover)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated 3-node embedded-JetStream (R3) Will-outbox failover tests
    # (jetstream_cluster_harness_test.go). Split into its own job because it
    # spins up three nats-server processes per test and drives Raft leader
    # elections, so it is slower and flakier than the single-node fulltests job.
    # The tests self-skip unless MQTTNB_CLUSTER_FAILOVER_TESTS=1, so the normal
    # fulltests job runs only the cheap R3 smoke test. Every harness node runs
    # js_ack_fc_v2 (the acknowledgement layout upstream makes default in 2.16),
    # and TestMQTTAckReplyLayoutV2Replicated is the witness that the broker
    # parses and acknowledges it; single-node tests keep the pin's v1 default.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: test
        env:
          MQTTNB_CLUSTER_FAILOVER_TESTS: '1'
        run: go test -tags mqttport_fulltests -race -run '^(TestMQTTWillOutboxReplicated|TestMQTTAckReplyLayoutV2Replicated)' ./internal/mqtt/
      - name: test (embedded-NATS cluster)
        env:
          MQTTNB_CLUSTER_FAILOVER_TESTS: '1'
        run: go test -race -run '^TestEmbeddedClusterFormsAfterFirstProbeFails$' ./cmd/mqtt-nats-broker/

  depproof:
    name: dependency canary (JetStream terminal-write routes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # F-030's dependency canary: the two routes by which a Will-outbox write
    # conditioned on a superseded base could still reach the stream across a
    # stream-leader transition, run against isolated nats-server checkouts, plus the
    # mutation for each mechanism that closes one. See test/depproof/README.md.
    #
    # The job always starts and decides for itself, from the FILES the change touches,
    # whether the canary can have been invalidated. Gating on the actor or on a label
    # would have missed a hand-written dependency bump, and then the push to main after
    # it -- which is exactly the change that must not land without the canary.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: decide whether this change can invalidate the canary
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An unknown or unborn base means we cannot prove the change is irrelevant,
          # so we run it. Failing open here would be the whole point of the job lost.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- go.mod go.sum test/depproof \
              internal/mqtt/will_terminal_cluster_test.go \
              | grep -q .; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.26'
          cache: true
      - name: route regressions and mutations
        if: steps.gate.outputs.run == 'true'
        run: make depproof

  lint:
    name: lint (go, markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # Pinned, not `latest`: the action resolves the binary, and .golangci.yml is
      # schema v2, which only a golangci-lint 2.x binary accepts. Action v6 mapped
      # `latest` to v1.64.8, so this job rejected the config instead of linting.
      # Bump the action major and this version together.
      #
      # The action only INSTALLS the binary; the passes are `make lint-go`'s, so CI runs exactly
      # the four passes a developer runs (production only, default tests, and both tagged builds).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: golangci-lint (four passes)
        run: make lint-go
      # Same linter and configuration as `make lint-md`, so a docs change that
      # passes locally cannot fail here (or the reverse).
      - name: markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md'

  # Cross-compiles both platforms from one amd64 builder, the way release.yml builds
  # them. The native legs below do not exercise that path, so this job stays.
  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build multi-arch (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}

  kubernetes-manifest:
    name: kubernetes manifest render
    # Renders the example deployment (docs/deploy/kubernetes: the base and the TLS overlay)
    # with the pinned kustomize and checks the output against the binary. The static
    # checks run in build-test; admission by a real API server is not checked here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: render and check
        run: make kubernetes-render

  helm-chart:
    name: helm chart lint and render
    # Lints and renders the Helm chart (charts/mqtt-nats-broker: every shipped variant under
    # ci/) and the topology-3 values for the official NATS chart with the pinned helm, and
    # checks the output against the binary (cmd/mqtt-nats-broker/helm_chart_test.go).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: lint, render and check
        run: make helm-check

  helm-install:
    name: helm install (${{ matrix.platform }})
    # Installs the chart into a kind cluster with both images built for the runner: every
    # topology under Restricted Pod Security, MQTT through JetStream, upgrade and
    # rollback, the NATS dependency's reload, and the shared pod's shutdown order
    # (test/helmsmoke). Native, like the image jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: install and check
        run: make helm-smoke

  helm-publish:
    name: helm chart publication dry run
    # release.yml's version and chart jobs end to end, with an authenticated registry on the
    # runner standing in for GHCR: the version a synthetic tag names, the refusals, the
    # package checked against the image tags metadata-action derives from the same tag,
    # login, push, and the chart pulled back at that version and checked again.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: v1.2.3-alpha.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - id: external
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          context: workflow
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - id: embedded
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          context: workflow
          flavor: |
            suffix=-embedded,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - name: refuse what is not a release tag or a canonical chart registry
        run: |
          # helm push joins the registry and the chart name with path.Join, the pull-back
          # and the collision check by text: only a canonical registry makes them agree
          for registry in oci://localhost:5000/charts/ oci://localhost:5000//charts \
            oci://localhost:5000/charts/.. oci://localhost:5000/Charts oci://localhost:5000; do
            if make -s chart-registry-check CHART_REGISTRY="$registry" 2> refusal.txt; then
              echo "accepted $registry" >&2; exit 1
            fi
            grep -qF "not a canonical chart registry: \"$registry\"" refusal.txt
          done
          # 47 characters after the v: one more than helm.sh/chart holds untruncated
          for tag in v1.2 1.2.3 v1.2.3+b1 v01.2.3 v1.2.3-01 v1234567890.0.0 v1.2.3-alpha-embedded \
            v1.2.3-alpha- "v1.2.3-$(printf 'a%.0s' $(seq 41))" 'v1.2.3$(id)'; do
            if printf '%s\n' "$tag" | make -s release-version 2> refusal.txt; then
              echo "accepted $tag" >&2; exit 1
            fi
            grep -qF "not a release tag: \"$tag\"" refusal.txt
          done
          test "$(printf '%s\n' "$TAG" | make -s release-version)" = 1.2.3-alpha.4
          long="1.2.3-$(printf 'a%.0s' $(seq 40))"
          test "$(printf 'v%s\n' "$long" | make -s release-version)" = "$long"
      - name: authenticated registry
        run: |
          mkdir -p "$RUNNER_TEMP/auth"
          docker run --rm --entrypoint htpasswd httpd:2.4 -Bbn ci ci-password > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d --name registry -p 5000:5000 -v "$RUNNER_TEMP/auth:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=ci \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2.8.3
      - name: package, push and check, as the release does
        env:
          HELM_REGISTRY_PASSWORD: ci-password
          MQTTNB_HELM_EXTERNAL_IMAGES: ${{ steps.external.outputs.tags }}
          MQTTNB_HELM_EMBEDDED_IMAGES: ${{ steps.embedded.outputs.tags }}
        run: |
          make helm-publish TAG="$TAG" CHART_REGISTRY=oci://localhost:5000/charts \
            HELM_REGISTRY_USER=ci HELM_PUSH_FLAGS=--plain-http
      - name: the registry refuses a push without the login's credential
        # Fresh helm and docker credential stores, so nothing the login stored can answer.
        run: |
          empty=$(mktemp -d)
          if HELM_CONFIG_HOME="$empty/helm" DOCKER_CONFIG="$empty/docker" HELM_CACHE_HOME="$empty/cache" \
            bin/helm push bin/helm-package/mqtt-nats-broker-1.2.3-alpha.4.tgz oci://localhost:5000/charts \
            --plain-http 2> push.txt; then
            echo "an unauthenticated push was accepted" >&2; exit 1
          fi
          cat push.txt
          # helm's answer to the registry's 401 challenge when it holds no credential
          grep -qE 'basic credential not found|401 Unauthorized' push.txt

  image-external:
    name: image-external (${{ matrix.platform }})
    # Runs the external-NATS image itself, natively on each architecture, under a pod's
    # constraints (read-only root, no capabilities, the image's own numeric user):
    # contents, trust, Secret-mounted TLS, probes, and signals as PID 1
    # (test/imagesmoke). Native rather than QEMU, because the tests time signals and
    # TLS handshakes that emulation slows and distorts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: docker/setup-buildx-action@v4
      - name: build (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mqtt-nats-broker:smoke-external
          build-args: |
            VERSION=ci-${{ github.sha }}
      - name: smoke test
        env:
          MQTTNB_IMAGE_SMOKE_IMAGE: mqtt-nats-broker:smoke-external
        run: go test -count=1 -v -timeout 15m ./test/imagesmoke/

  image-embedded:
    name: image-embedded (${{ matrix.platform }})
    # The embedded-NATS image (Dockerfile target `embedded`), natively on each
    # architecture: contents, the default invocation and its credentials, persistence on
    # the /data volume across a restart, and a three-container cluster losing its
    # stream leader (test/imagesmoke).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: docker/setup-buildx-action@v4
      - name: build (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: embedded
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mqtt-nats-broker:smoke-embedded
          build-args: |
            VERSION=ci-${{ github.sha }}
      - name: smoke test
        env:
          MQTTNB_IMAGE_SMOKE_EMBEDDED_IMAGE: mqtt-nats-broker:smoke-embedded
        run: go test -count=1 -v -timeout 20m -run '^TestEmbeddedImage' ./test/imagesmoke/

  release-tags:
    name: release tag sets are disjoint
    # The two images publish to one repository; the embedded variant's tags carry a
    # suffix, including its `latest`. A flavor that dropped onlatest would let the
    # embedded job overwrite the external image's `latest`, so both tag sets are rendered
    # for a sample release ref and compared.
    runs-on: ubuntu-latest
    steps:
      - id: external
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          context: workflow
          tags: |
            type=semver,pattern={{version}},value=v1.2.3
            type=semver,pattern={{major}}.{{minor}},value=v1.2.3
            type=semver,pattern={{major}},value=v1.2.3
            type=raw,value=latest
      - id: embedded
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          context: workflow
          flavor: |
            suffix=-embedded,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=v1.2.3
            type=semver,pattern={{major}}.{{minor}},value=v1.2.3
            type=semver,pattern={{major}},value=v1.2.3
            type=raw,value=latest
      - name: compare
        env:
          EXTERNAL: ${{ steps.external.outputs.tags }}
          EMBEDDED: ${{ steps.embedded.outputs.tags }}
        run: |
          printf '%s\n' "$EXTERNAL" | sort > external.txt
          printf '%s\n' "$EMBEDDED" | sort > embedded.txt
          cat external.txt embedded.txt
          test "$(grep -c . external.txt)" -eq 4
          test "$(grep -c . embedded.txt)" -eq 4
          grep -q -- ':latest-embedded$' embedded.txt
          if comm -12 external.txt embedded.txt | grep -q .; then
            echo 'the external and embedded images share a tag'; exit 1
          fi

  conformance:
    name: MQTT conformance (vibesrc/mqttconformance)
    runs-on: ubuntu-latest
    # Baseline is 0 failures (124/124 v3.1.1, 106/106 v5); run.sh gates on
    # regressions vs test/conformance/baseline/conformance-v{3,5}.txt.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        # run.sh's floor check decodes /varz with python3 rather than pattern-matching
        # it. This job runs no Python suite, but it does run that check.
        with: { python-version: '3.x' }
      - name: start NATS with JetStream
        # Pinned by digest at the 2.15.1 floor, NOT `latest`: a floating tag would
        # move the backing server with no repository change and no paired config
        # edit. The image is the upstream publisher's synadia/nats-server on Docker
        # Hub (built by nats-io/nats-docker), not the Docker Official `nats` image,
        # which had no 2.15.1 tag when the floor moved. This job used to launch `-js` with no config file; it now needs one,
        # because `-js` alone leaves default_max_consumers at its 1000-per-stream
        # default and that ARMS the cap rather than opting out of it (F-095).
        # nats-plain.conf is this job's own, unauthenticated, and is NOT nats.conf:
        # the Paho job's ACLs would break this job's non-passthrough broker.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/test/conformance/nats-plain.conf:/etc/nats/nats.conf:ro" \
            synadia/nats-server:2.15.1-scratch@sha256:57e8640c67acb4f40fd453cde5518baa601759ed242a476b705bbfb573cf01f2 -c /etc/nats/nats.conf
      - name: build broker
        run: go build -o mqtt-nats-broker ./cmd/mqtt-nats-broker
      - name: build mqtt-conformance
        run: |
          git clone --depth 1 https://github.com/vibesrc/mqttconformance /tmp/mc
          (cd /tmp/mc && cargo build --release)
          echo "/tmp/mc/target/release" >> "$GITHUB_PATH"
      - name: run broker
        run: |
          ./mqtt-nats-broker -nats nats://127.0.0.1:4222 -port 1883 -auth-passthrough=false -log-level warn &
          echo $! > broker.pid
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null && break; sleep 1; done
      - name: run conformance suites
        run: ./test/conformance/run.sh
      - name: stop broker
        if: always()
        run: kill "$(cat broker.pid)" 2>/dev/null || true

  paho:
    name: MQTT conformance (Eclipse Paho interop)
    runs-on: ubuntu-latest
    # Runs the Paho MQTT 5.0 interoperability suite against an auth-passthrough
    # broker backed by a NATS server whose "mqtt" user is denied subscribe on
    # test/nosubscribe (test_subscribe_failure). run.sh gates on regressions vs
    # test/conformance/baseline/paho.txt.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - name: start NATS with JetStream + deny ACL
        # Digest-pinned at the 2.15.1 floor, same image, for the same reason as the job above;
        # see docs/CONFORMANCE.md. Port 8222 is the monitoring endpoint run.sh
        # reads to assert the version and the effective consumer limit.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/test/conformance/nats.conf:/etc/nats/nats.conf:ro" \
            synadia/nats-server:2.15.1-scratch@sha256:57e8640c67acb4f40fd453cde5518baa601759ed242a476b705bbfb573cf01f2 -c /etc/nats/nats.conf
      - name: build broker
        run: go build -o mqtt-nats-broker ./cmd/mqtt-nats-broker
      - name: run broker (auth passthrough + deny)
        run: |
          ./mqtt-nats-broker -nats nats://127.0.0.1:4222 \
            -nats-user service -nats-pass service \
            -port 1883 -auth-passthrough -default-user mqtt -default-pass mqtt \
            -keepalive-max 60 -log-level warn &
          echo $! > broker.pid
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null && break; sleep 1; done
      - name: run Paho interoperability suite
        run: SUITES=paho ./test/conformance/run.sh
      - name: stop broker
        if: always()
        run: kill "$(cat broker.pid)" 2>/dev/null || true
