name: PR images

# A pull request's images, built only after the owner approves the run: the `pr-images`
# environment requires the owner's review, so every run waits at that gate and nothing is
# built or pushed before it. pull_request_target runs this file as it is on main, so a pull
# request cannot change what publishes; it builds the pull request's head only once
# approved. Approving means trusting that head's Dockerfile and build steps.
#
# A job naming a missing environment creates it unprotected, so approval-gate checks
# first that pr-images exists and requires the owner's review, and stops the run if not.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the pull request supersedes a run still waiting for approval.
concurrency:
  group: pr-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval-gate:
    name: PR images (approval gate)
    # Fails closed: unless the pr-images environment exists and requires the owner's
    # review, the owner's alone, nothing below runs. Without this, a missing environment would be created
    # unprotected by the job that names it. It checks out nothing and builds nothing.
    if: github.repository == 'nberlee/mqtt-nats-broker'
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: the environment requires the owner's review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/environments/pr-images" > env.json
          # The owner and no one else: any one listed reviewer can approve, so a second
          # reviewer or a team would let someone else release the build.
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers")
                 | .reviewers[]? | "\(.type):\(.reviewer.login // .reviewer.slug)"]
                 == ["User:nberlee"]' env.json

  images:
    name: PR images (${{ matrix.variant }})
    # Tags `pr-<number>` and `pr-<number>-<short head>`, the embedded variant suffixed
    # `-embedded`. Never `main`, `sha-`, `latest` or a version tag.
    if: github.repository == 'nberlee/mqtt-nats-broker'
    needs: approval-gate
    environment: pr-images
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: external, target: '', suffix: '' }
          - { variant: embedded, target: embedded, suffix: '-embedded' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: short head
        id: head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The labels name the pull request's head, the commit built, not main's.
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          context: workflow
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ steps.head.outputs.short }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          provenance: true
          sbom: true
