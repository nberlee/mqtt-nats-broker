name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: release version
    # Every publishing job waits on this one, so a tag that is not a release tag (Makefile,
    # release-version) publishes nothing. The tag goes in on stdin: make would expand a
    # dollar sign in a make argument, and a git tag may contain one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check the tag
        run: printf '%s\n' "$GITHUB_REF_NAME" | make -s release-version

  image:
    name: build & push multi-arch image
    needs: version
    runs-on: ubuntu-latest
    # The chart job checks its default image against these.
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true

  image-embedded:
    name: build & push multi-arch embedded-NATS image
    needs: version
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The same repository as the external image: every tag, latest included, is
          # suffixed, so neither image's tags can overwrite the other's (CI's
          # release-tags job checks the two sets are disjoint).
          flavor: |
            suffix=-embedded,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: embedded
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true

  binaries:
    name: release binaries
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="mqtt-nats-broker_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/mqtt-nats-broker
          sha256sum "$out" > "$out.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            mqtt-nats-broker_*

  chart:
    name: package & push the Helm chart
    # The chart's default image is <repository>:<version>, "-embedded" appended for the
    # embedded topology, so it is pushed only once both images are, and checked against the
    # tags their jobs report. helm push appends the chart name to the registry path: under
    # /charts the chart is ghcr.io/<owner>/charts/mqtt-nats-broker, never the images'
    # repository, whose version tags it would overwrite. GHCR names are lowercase.
    needs: [version, image, image-embedded]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: package, push and check
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MQTTNB_HELM_EXTERNAL_IMAGES: ${{ needs.image.outputs.tags }}
          MQTTNB_HELM_EMBEDDED_IMAGES: ${{ needs.image-embedded.outputs.tags }}
        run: |
          make helm-publish TAG="$GITHUB_REF_NAME" \
            CHART_REGISTRY="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" \
            HELM_REGISTRY_USER="$GITHUB_ACTOR"
