name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# One run per tag at a time, never cancelled: a second run for the same tag (a tag moved
# and pushed again) starts only once the first has finished, and its first check then
# finds the release and refuses, so two runs cannot publish over each other.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: release version
    # Every publishing job waits on this one, so a tag that is not a release tag (Makefile,
    # release-version) publishes nothing. The tag goes in on stdin: make would expand a
    # dollar sign in a make argument, and a git tag may contain one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check the tag
        run: printf '%s\n' "$GITHUB_REF_NAME" | make -s release-version
      # The release's notes are its CHANGELOG.md entry, committed before the tag
      # (docs/ROADMAP.md, "Release documentation"): a tag without one publishes nothing.
      # A tag already released is not published again (.github/check_unreleased.sh); every
      # job that pushes to the registry repeats the check, since re-running one job alone
      # does not re-run this one.
      - name: the tag is not released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/check_unreleased.sh
      - name: check the changelog entry
        run: |
          v=$(printf '%s\n' "$GITHUB_REF_NAME" | make -s release-version)
          python3 .github/release_notes.py CHANGELOG.md "$v" > /dev/null

  image:
    name: build & push multi-arch image
    needs: version
    runs-on: ubuntu-latest
    # The chart job checks its default image against these.
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: the tag is not released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/check_unreleased.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true

  image-embedded:
    name: build & push multi-arch embedded-NATS image
    needs: version
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: the tag is not released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/check_unreleased.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The same repository as the external image: every tag, latest included, is
          # suffixed, so neither image's tags can overwrite the other's (CI's
          # release-tags job checks the two sets are disjoint).
          flavor: |
            suffix=-embedded,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: embedded
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true

  binaries:
    name: release binaries
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="mqtt-nats-broker_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/mqtt-nats-broker
          sha256sum "$out" > "$out.sha256"
      # The GitHub release is created once, by the release job, with its notes and every
      # binary: nothing is public on the release page before its notes are complete.
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mqtt-nats-broker_*
          if-no-files-found: error

  chart:
    name: package & push the Helm chart
    # The chart's default image is <repository>:<version>, "-embedded" appended for the
    # embedded topology, so it is pushed only once both images are, and checked against the
    # tags their jobs report. helm push appends the chart name to the registry path: under
    # /charts the chart is ghcr.io/<owner>/charts/mqtt-nats-broker, never the images'
    # repository, whose version tags it would overwrite. GHCR names are lowercase.
    needs: [version, image, image-embedded]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the tag is not released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/check_unreleased.sh
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: package, push and check
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MQTTNB_HELM_EXTERNAL_IMAGES: ${{ needs.image.outputs.tags }}
          MQTTNB_HELM_EMBEDDED_IMAGES: ${{ needs.image-embedded.outputs.tags }}
        run: |
          make helm-publish TAG="$GITHUB_REF_NAME" \
            CHART_REGISTRY="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" \
            HELM_REGISTRY_USER="$GITHUB_ACTOR"

  release:
    name: GitHub release
    # Creates the GitHub release in one step, with every binary and its notes: the
    # version's CHANGELOG.md entry, then what this run published, both images and the
    # chart with their digests, which exist only once the tag is built and so are written
    # here and not in the changelog. A version with a pre-release part (v0.1.0-alpha.1) is
    # a GitHub pre-release, as the images leave `latest` to releases without one.
    needs: [version, image, image-embedded, chart, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          EMBEDDED_DIGEST: ${{ needs.image-embedded.outputs.digest }}
        run: |
          set -euo pipefail
          v=$(printf '%s\n' "$GITHUB_REF_NAME" | make -s release-version)
          python3 .github/release_notes.py CHANGELOG.md "$v" > entry.md
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY,,}"
          tok=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?scope=repository:$owner/charts/mqtt-nats-broker:pull" | jq -r .token)
          chart=$(curl -fsSI -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$owner/charts/mqtt-nats-broker/manifests/$v" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
          test -n "$IMAGE_DIGEST" && test -n "$EMBEDDED_DIGEST" && test -n "$chart"
          test "$(ls dist | wc -l)" -eq 8
          {
            cat entry.md
            echo
            echo '### Artifacts'
            echo
            echo "- Container image, broker in front of your NATS (linux/amd64, linux/arm64): \`ghcr.io/$repo:$v\` (\`$IMAGE_DIGEST\`)"
            echo "- Container image, broker with JetStream embedded (linux/amd64, linux/arm64): \`ghcr.io/$repo:$v-embedded\` (\`$EMBEDDED_DIGEST\`)"
            echo "- Helm chart: \`oci://ghcr.io/$owner/charts/mqtt-nats-broker\`, version \`$v\` (\`$chart\`)"
            echo '- Binaries for Linux and macOS on amd64 and arm64, with SHA-256 checksums, attached below.'
          } > notes.md
          prerelease=()
          case "$v" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"

  wiki:
    name: publish the wiki
    # The wiki mirrors the newest published release: the pages are rendered from this
    # tag's docs/, every repository link pinned to the tag's commit, and `wikigen publish`
    # pushes them unless the wiki already shows a newer release. No concurrency group: a
    # group keeps one pending job and can cancel the newest release's; publish arbitrates
    # by retrying a rejected push against what landed instead. The wiki repository exists
    # only once its first page has been created in the web UI.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # Rendered before the wiki is checked out, so the wiki's clone is not among the files
      # the render sees in this checkout.
      - name: render
        run: |
          go run ./cmd/wikigen render -tag "$GITHUB_REF_NAME" -sha "$(git rev-parse HEAD)" \
            -repo "$GITHUB_REPOSITORY" -out "$RUNNER_TEMP/wiki"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
      - name: publish
        run: go run ./cmd/wikigen publish -wiki wiki-repo -out "$RUNNER_TEMP/wiki"
