apiVersion: v1
kind: Service
metadata:
  name: mqtt-nats-broker
  labels:
    app.kubernetes.io/name: mqtt-nats-broker
spec:
  # A TCP (L4) load balancer spreads MQTT clients across the frontends; a session
  # survives a reconnect to any instance, since its state lives in JetStream. The
  # health port is not exposed.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mqtt-nats-broker
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
