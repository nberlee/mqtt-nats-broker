# Example: MQTT authentication and authorization with NATS users and passwords.
# docs/AUTHENTICATION.md walks through it; cmd/mqtt-nats-broker/nats_auth_example_test.go
# runs the broker against this file.
#
# The broker's service user and every MQTT identity live in ONE account: the broker
# refuses a CONNECT whose credentials belong to another account. Passwords come from
# the environment, and an unset variable stops the server:
#   SERVICE_PASSWORD    the broker's service connection (-nats-user mqtt-broker)
#   ANONYMOUS_PASSWORD  what MQTT clients without a user name connect as
#                       (-default-user anonymous)
#   ALICE_PASSWORD, BOB_PASSWORD, OUTSIDER_PASSWORD
#
# An MQTT topic maps onto a NATS subject by swapping the separators: sensors/alice/t is
# sensors.alice.t. Permissions below are written in NATS subjects. A filter ending in /#
# also matches its parent level (sensors/# matches sensors itself), so the broker
# subscribes to both sensors and sensors.>, and a subscribe allow needs both.

jetstream {
  limits { default_max_consumers: -1 }
}

# Denied to every MQTT identity, in both directions: the broker's reserved namespace,
# the JetStream API (domain-qualified and acknowledgement subjects included) and the KV
# and object-store data subjects. Without them an MQTT client could forge broker state
# or, publishing to $JS/API/STREAM/DELETE/$MQTT_sess, delete the broker's streams.
RESERVED: ["$MQTT.>", "$JS.>", "$KV.>", "$O.>"]

accounts {
  APP {
    jetstream: enabled
    users: [
      # The service identity. It needs the whole reserved namespace and the JetStream API
      # in this account, so it gets everything; keep its password away from MQTT clients.
      { user: mqtt-broker, password: $SERVICE_PASSWORD }

      # Anonymous MQTT clients. Limited to public/#, where they may publish (retained
      # messages included) and subscribe, and allowed to publish
      # $SYS.REQ.USER.INFO, which every MQTT identity needs: the broker asks it who the
      # client is at CONNECT. With no user like this and no -default-user, an MQTT client
      # without credentials is refused.
      {
        user: anonymous
        password: $ANONYMOUS_PASSWORD
        permissions: {
          publish: { allow: ["public.>", "$SYS.REQ.USER.INFO"], deny: $RESERVED }
          subscribe: { allow: ["public", "public.>"], deny: $RESERVED }
        }
      }

      # A device that reports its own sensors and takes its own commands.
      {
        user: alice
        password: $ALICE_PASSWORD
        permissions: {
          publish: { allow: ["sensors.alice.>", "$SYS.REQ.USER.INFO"], deny: $RESERVED }
          subscribe: { allow: ["commands.alice", "commands.alice.>", "public", "public.>"], deny: $RESERVED }
        }
      }

      # A dashboard that reads every sensor and sends commands to any device.
      {
        user: bob
        password: $BOB_PASSWORD
        permissions: {
          publish: { allow: ["commands.>", "public.>", "$SYS.REQ.USER.INFO"], deny: $RESERVED }
          subscribe: { allow: ["sensors", "sensors.>", "public", "public.>"], deny: $RESERVED }
        }
      }
    ]
  }

  # Another account. Its users authenticate to NATS, but the broker refuses them at
  # CONNECT: the broker's streams live in APP.
  OTHER {
    users: [
      {
        user: outsider
        password: $OUTSIDER_PASSWORD
        permissions: {
          publish: { deny: $RESERVED }
          subscribe: { deny: $RESERVED }
        }
      }
    ]
  }
}
